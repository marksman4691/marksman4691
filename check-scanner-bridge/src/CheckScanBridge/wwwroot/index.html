<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheckScanBridge 測試頁</title>
  <style>
    body { font-family: system-ui, "Microsoft JhengHei", sans-serif; margin: 24px; color: #222; }
    button { font-size: 16px; padding: 8px 16px; margin-right: 8px; }
    #log { background: #f4f4f4; padding: 12px; white-space: pre-wrap; font-family: monospace; max-height: 200px; overflow: auto; }
    .item { border: 1px solid #ccc; padding: 12px; margin: 12px 0; }
    .item img { max-width: 48%; border: 1px solid #ddd; margin-right: 1%; vertical-align: top; }
    .warn { color: #b45309; }
    table { border-collapse: collapse; margin-top: 8px; font-size: 14px; }
    td { padding: 2px 12px 2px 0; font-family: monospace; }
  </style>
</head>
<body>
  <h1>支票掃描 Bridge 測試頁</h1>
  <p>
    <label><input id="batch" type="checkbox"> 連續掃描</label>
    <label style="margin-left:12px">逾時 (ms) <input id="timeout" type="number" value="30000" style="width:6em"></label>
  </p>
  <p>
    <button id="status">檢查狀態</button>
    <button id="scan">掃描支票</button>
    <button id="cancel">取消</button>
  </p>
  <div id="log"></div>
  <div id="items"></div>

  <script type="module">
    import { CheckScanBridge } from './checkscan-bridge.js';
    const bridge = new CheckScanBridge({ baseUrl: location.origin });
    const $ = (id) => document.getElementById(id);
    const log = (m) => { $('log').textContent += `[${new Date().toLocaleTimeString()}] ${m}\n`; };

    $('status').onclick = async () => {
      try { log(JSON.stringify(await bridge.device())); } catch (e) { log(`錯誤 ${e.code}: ${e.message}`); }
    };
    $('cancel').onclick = async () => log(JSON.stringify(await bridge.cancel()));
    $('scan').onclick = async () => {
      $('items').innerHTML = '';
      log('請放入支票…');
      try {
        const r = await bridge.scan({ batch: $('batch').checked, timeoutMs: +$('timeout').value });
        log(`完成 ${r.items.length} 張` + (r.error ? `，中途錯誤 ${r.error.code}: ${r.error.message}` : ''));
        for (const it of r.items) {
          const div = document.createElement('div');
          div.className = 'item';
          const m = it.micr ?? {};
          div.innerHTML = `<b>#${it.sequence}</b>
            ${it.warnings.length ? `<span class="warn">⚠ ${it.warnings.join(', ')}</span>` : ''}<br>
            <img src="${CheckScanBridge.previewUrl(it.front)}" title="front">
            <img src="${CheckScanBridge.previewUrl(it.back)}" title="back">
            <table>
              <tr><td>MICR</td><td>${m.raw ?? '(無)'}</td></tr>
              <tr><td>Routing</td><td>${m.routingNumber ?? ''} ${m.routingValid ? '✓' : '✗'}</td></tr>
              <tr><td>Account / Serial</td><td>${m.accountNumber ?? ''} / ${m.serialNumber ?? ''}</td></tr>
              <tr><td>X9 On-Us / Aux</td><td>${m.onUs ?? ''} / ${m.auxiliaryOnUs ?? ''}</td></tr>
              <tr><td>影像</td><td>${it.front.format} ${it.front.width}×${it.front.height} @${it.front.dpi}dpi,
                front ${it.front.bytes} B, back ${it.back.bytes} B</td></tr>
            </table>`;
          $('items').append(div);
        }
      } catch (e) {
        log(`錯誤 ${e.code}: ${e.message}`);
      }
    };
  </script>
</body>
</html>
