<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>支票掃描上傳範例</title>
</head>
<body>
  <!-- 範例：在你的 Web 應用程式中整合 bridge，掃描後上傳到自己的後端 -->
  <button id="scan">掃描並上傳支票</button>
  <button id="cancel" disabled>取消</button>
  <p id="msg"></p>
  <img id="preview" style="max-width:600px">

  <script type="module">
    import { CheckScanBridge } from './checkscan-bridge.js';

    const bridge = new CheckScanBridge(/* { apiKey: '...' } */);
    const UPLOAD_URL = '/api/checks/upload'; // ← 換成你的後端上傳 API
    const msg = (t) => (document.getElementById('msg').textContent = t);

    document.getElementById('scan').onclick = async () => {
      try {
        await bridge.health();
      } catch {
        msg('找不到掃描機程式，請先安裝並啟動 CheckScanBridge');
        return;
      }

      document.getElementById('cancel').disabled = false;
      msg('請將支票放入掃描機…');
      try {
        const result = await bridge.scan({ format: 'Jpeg', color: 'Gray', dpi: 200, timeoutMs: 60000 });
        const front = result.images.find((i) => i.side === 'front');
        document.getElementById('preview').src = CheckScanBridge.toDataUrl(front);

        const form = new FormData();
        form.append('scanId', result.scanId);
        if (result.micr) form.append('micr', result.micr);
        for (const img of result.images) {
          const ext = img.contentType.split('/')[1];
          form.append(img.side, CheckScanBridge.toBlob(img), `${result.scanId}_${img.side}.${ext}`);
        }

        msg('上傳中…');
        const res = await fetch(UPLOAD_URL, { method: 'POST', body: form, credentials: 'include' });
        if (!res.ok) throw new Error(`上傳失敗 HTTP ${res.status}`);
        msg('上傳完成');
      } catch (e) {
        msg(`${e.code ?? 'ERROR'}: ${e.message}`);
      } finally {
        document.getElementById('cancel').disabled = true;
      }
    };

    document.getElementById('cancel').onclick = () => bridge.cancel();
  </script>
</body>
</html>
